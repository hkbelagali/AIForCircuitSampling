[project]
name = "m9"
version = "0.1.0"
description = "Hubbard ground-state sample complexity: AR-RNN + Adam-VMC."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["m9*"]
