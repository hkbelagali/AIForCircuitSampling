[project]
name = "aics"
version = "0.0.1"
description = "AI for Circuit Sampling -- learned generative models over quantum-relevant bitstrings."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
