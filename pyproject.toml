[project]
name = "aics-circuit-sampling"
version = "0.2.0"
description = "AI for Circuit Sampling — RCS-NLL learning pipeline. m9 (Hubbard sample-complexity) ships archived."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "matplotlib",
    "cirq",
    "quimb",
    "pandas",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "archive"]
include = ["aics*", "m9*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
